aid: basecamp-research
name: Basecamp Research
description: 'Basecamp Research is a London-based biotech company mapping global genetic
  biodiversity to power AI-based design of biological systems. Its core asset is BaseGraph,
  a Neo4j-backed knowledge graph of billions of biological relationships assembled from
  novel protein and genome sequences collected under access-and-benefit-sharing partnerships
  with biodiversity-rich countries. On top of this data it builds foundation models and
  tools including EDEN (a large-scale biology sequence model), BaseFold (3D protein
  structure prediction that improves on AlphaFold2 for large, complex structures and
  small-molecule interactions), and BaseScan (an automated annotation pipeline). Basecamp
  works with pharma and biotech partners on drug discovery and enzyme/protein design, and
  has collaborated with NVIDIA to bring BaseFold to the BioNeMo platform. Backed by True
  Ventures. This profile is maintained in the API Evangelist network; Basecamp Research
  currently exposes no public self-serve developer API - data and models are accessed via
  partnerships, and product docs sit behind an authenticated portal.'
